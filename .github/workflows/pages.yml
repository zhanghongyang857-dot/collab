# GitHub Pages：演示站已搬到 https://collab.hongyangz.top/ ，这里只发布跳转页 pages/（index.html、404.html），
# 把旧的 github.io 演示站链接按路径跳到新站。测试在导出时于本机跑过，这里不再构建演示。
name: 跳转页

on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
