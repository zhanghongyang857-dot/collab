# 演示站：每次推送到 main，跑测试、生成「万历新政」八回的只读看板，发布到 GitHub Pages。
# 第一次用要在仓库 Settings → Pages 里把 Source 选成 GitHub Actions。生成物不进版本库。
name: 演示站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 工具包目前只在 macOS 上用过（init.sh 等脚本按 macOS 写），演示也在 macOS 上生成
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试
        run: python3 -m unittest discover -s tests
      - name: 生成演示站
        run: python3 demo/site.py --输出 _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
