<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="board.seq.meeting">Meeting</title>
<link rel="stylesheet" href="/static/board.css">
<script src="/static/vocab.js" defer></script>
<script src="/static/i18n.js" defer></script>
<script src="/static/meet.js" defer></script>
</head>
<body>
<header class="top">
  <a class="back" id="back" href="/" data-i18n="page.back_board">← Board</a>
  <h1 id="name"></h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="meta" id="tick"></span>
</header>
<main class="meet">
  <nav class="rooms" id="rooms"></nav>
  <section class="chat">
    <div class="chead" id="chead"></div>
    <div class="tl" id="tl"><div class="empty" data-i18n="page.loading">Loading…</div></div>
    <div class="composer" id="composer">
      <div class="menu" id="menu" hidden></div>
      <div class="box">
        <textarea id="box" rows="1" placeholder="" data-i18n-placeholder="page.box"></textarea>
        <button id="priv" class="round" type="button" data-i18n-title="meet.hint.private" aria-pressed="false" data-i18n="page.private_btn">P</button>
        <button id="send" class="round send" type="button" data-i18n-aria="page.send" data-i18n="page.send_btn">↑</button>
      </div>
      <div class="hintrow"><span id="hint"></span><span id="err" class="err"></span><span id="acts"></span></div>
    </div>
  </section>
</main>
</body>
</html>
